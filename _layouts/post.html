---
layout: default
---
<article class="post">
  <p class="cmd">$ cat {{ page.path | split: '/' | last }}</p>
  <h1>{{ page.title }}</h1>
  <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
  <div class="body">
{{ content }}
  </div>
  <p class="back"><a href="{{ '/' | relative_url }}">cd ..</a></p>
</article>
